<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Workout">
<meta name="theme-color" content="#0a0a0a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Workout Tracker</title>
<style>
:root {
  --bg: #0a0a0a; --bg2: #141414; --bg3: #1c1c1c;
  --border: rgba(255,255,255,0.08); --border2: rgba(255,255,255,0.14);
  --text: #f0f0f0; --text2: #888; --text3: #555;
  --accent: #e8f54e; --accent-dim: rgba(232,245,78,0.12); --accent-text: #0a0a0a;
  --blue: #4ea8f5; --blue-dim: rgba(78,168,245,0.12);
  --red: #f5694e;
  --radius: 12px; --radius-sm: 8px;
  --c-chest: #f5694e; --c-back: #4ea8f5; --c-legs: #4ef587;
  --c-shoulders: #c8d830; --c-arms: #f5b44e; --c-core: #b44ef5; --c-cardio: #f54eb4;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: -apple-system, 'Helvetica Neue', sans-serif; }
#app { height: 100dvh; display: flex; flex-direction: column; }
.nav { flex-shrink: 0; display: flex; background: var(--bg2); border-top: 0.5px solid var(--border); padding-bottom: env(safe-area-inset-bottom, 0px); }
.nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 10px 4px 8px; background: none; border: none; color: var(--text3); cursor: pointer; font-family: inherit; font-size: 10px; letter-spacing: 0.03em; transition: color 0.15s; }
.nav-btn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.nav-btn.active { color: var(--accent); }
.screens { flex: 1; overflow: hidden; position: relative; }
.screen { position: absolute; inset: 0; overflow-y: auto; display: none; padding-top: env(safe-area-inset-top, 0px); }
.screen.active { display: block; }
.page-header { padding: 20px 20px 16px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: var(--bg); z-index: 5; border-bottom: 0.5px solid var(--border); }
h1 { font-size: 22px; font-weight: 500; letter-spacing: -0.02em; }
.btn { border: none; border-radius: var(--radius-sm); padding: 10px 16px; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: opacity 0.15s, transform 0.1s; }
.btn:active { transform: scale(0.97); }
.btn-accent { background: var(--accent); color: var(--accent-text); }
.btn-ghost { background: var(--bg3); color: var(--text); border: 0.5px solid var(--border2); }
.btn-icon { background: var(--bg3); border: 0.5px solid var(--border); border-radius: var(--radius-sm); width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text2); }
.btn-icon svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.card { background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 14px; margin: 0 16px 10px; }
.card-tap { cursor: pointer; transition: background 0.15s; }
.card-tap:active { background: var(--bg3); }
.tag { display: inline-flex; align-items: center; font-size: 11px; font-weight: 500; padding: 3px 8px; border-radius: 99px; letter-spacing: 0.02em; }
.tag-chest { background: rgba(245,105,78,0.15); color: var(--c-chest); }
.tag-back { background: rgba(78,168,245,0.15); color: var(--c-back); }
.tag-legs { background: rgba(78,245,135,0.15); color: var(--c-legs); }
.tag-shoulders { background: rgba(232,245,78,0.15); color: var(--c-shoulders); }
.tag-arms { background: rgba(245,180,78,0.15); color: var(--c-arms); }
.tag-core { background: rgba(180,78,245,0.15); color: var(--c-core); }
.tag-cardio { background: rgba(245,78,180,0.15); color: var(--c-cardio); }
.form-label { font-size: 11px; color: var(--text2); letter-spacing: 0.06em; text-transform: uppercase; display: block; margin-bottom: 8px; }
input[type=text], input[type=date], input[type=number], select {
  width: 100%; padding: 11px 14px; background: var(--bg3); border: 0.5px solid var(--border2); border-radius: var(--radius-sm);
  color: var(--text); font-family: inherit; font-size: 15px; outline: none; -webkit-appearance: none; appearance: none; transition: border-color 0.15s;
}
input:focus, select:focus { border-color: var(--accent); }
select option { background: var(--bg3); }
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 100; align-items: flex-end; }
.modal-overlay.open { display: flex; }
.modal { background: var(--bg2); border-radius: 20px 20px 0 0; border-top: 0.5px solid var(--border2); width: 100%; max-height: 90dvh; overflow-y: auto; padding: 0 0 calc(24px + env(safe-area-inset-bottom, 0px)); animation: slideUp 0.26s cubic-bezier(0.32,0.72,0,1); }
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.modal-handle { width: 36px; height: 4px; background: var(--border2); border-radius: 2px; margin: 14px auto 18px; }
.modal-title { font-size: 16px; font-weight: 500; padding: 0 20px 16px; }
.modal-body { padding: 0 20px; }
.modal-footer { display: flex; gap: 10px; padding: 16px 20px 0; }
::-webkit-scrollbar { width: 0; }

/* ── カレンダー ── */
.cal-nav { display: flex; align-items: center; justify-content: space-between; padding: 20px 20px 12px; }
.cal-month { font-size: 18px; font-weight: 500; font-variant-numeric: tabular-nums; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; padding: 0 12px 4px; }
.cal-day-label { font-size: 10px; color: var(--text3); text-align: center; padding: 6px 0; }
.cal-cell { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 4px 2px; cursor: pointer; border-radius: 8px; transition: background 0.1s; }
.cal-cell:active { background: var(--bg3); }
.cal-num { font-size: 13px; font-variant-numeric: tabular-nums; color: var(--text2); width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
.cal-cell.today .cal-num { border: 1px solid var(--text3); color: var(--text); }
.cal-cell.other-month .cal-num { color: var(--text3); opacity: 0.4; }
.cal-dots { display: flex; gap: 2px; flex-wrap: wrap; justify-content: center; min-height: 8px; }
.cal-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.cal-legend { display: flex; flex-wrap: wrap; gap: 8px; padding: 8px 16px 16px; }
.cal-legend-item { display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--text3); }
.cal-legend-dot { width: 7px; height: 7px; border-radius: 50%; }

/* ── 記録 ── */
.rec-date-bar { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 0.5px solid var(--border); background: var(--bg); position: sticky; top: 0; z-index: 4; }
.rec-date-bar input[type=date] { flex: 1; font-size: 14px; padding: 8px 12px; }
.ex-card { background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius); margin: 12px 16px 0; overflow: hidden; }
.ex-card-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px 10px; }
.ex-card-title { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ex-card-body { padding: 0 14px 4px; }
.set-list { margin-bottom: 6px; }
.set-item { display: grid; grid-template-columns: 22px 1fr 1fr 56px 28px; gap: 6px; align-items: center; padding: 5px 0; border-bottom: 0.5px solid var(--border); }
.set-item:last-child { border-bottom: none; }
.set-n { font-size: 11px; color: var(--text3); text-align: center; font-variant-numeric: tabular-nums; }
.set-val { font-size: 13px; font-variant-numeric: tabular-nums; text-align: center; color: var(--text); }
.set-rm-val { font-size: 11px; color: var(--blue); text-align: center; font-variant-numeric: tabular-nums; }
.set-del-btn { background: none; border: none; color: var(--text3); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 4px; }
.set-del-btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; }
.set-col-header { display: grid; grid-template-columns: 22px 1fr 1fr 56px 28px; gap: 6px; padding: 4px 0 2px; }
.set-col-label { font-size: 10px; color: var(--text3); text-align: center; letter-spacing: 0.04em; }
.set-input-row { display: grid; grid-template-columns: 22px 1fr 1fr 56px 28px; gap: 6px; align-items: center; padding: 6px 0; }
.set-input-row .set-n { color: var(--accent); }
.set-mini-input { background: var(--bg3); border: 0.5px solid var(--border2); border-radius: 6px; color: var(--text); font-size: 14px; text-align: center; padding: 8px 4px; width: 100%; outline: none; -webkit-appearance: none; font-family: inherit; font-variant-numeric: tabular-nums; }
.set-mini-input:focus { border-color: var(--accent); }
.set-confirm-btn { background: var(--accent); border: none; border-radius: 6px; width: 28px; height: 36px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.set-confirm-btn svg { width: 14px; height: 14px; stroke: var(--accent-text); fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.ex-vol { font-size: 11px; color: var(--text3); padding: 4px 0 10px; display: flex; gap: 12px; }
.add-ex-wrap { padding: 10px 16px 24px; }
.stat-metric { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 0.5px solid var(--border); }
.stat-metric:last-child { border-bottom: none; }
.pr-val { font-size: 16px; font-weight: 500; color: var(--accent); font-variant-numeric: tabular-nums; }
.data-actions { display: flex; gap: 10px; padding: 0 16px 16px; flex-wrap: wrap; }
.data-actions .btn { flex: 1; min-width: 100px; justify-content: center; font-size: 13px; }
.prev-box { background: var(--blue-dim); border: 0.5px solid rgba(78,168,245,0.2); border-radius: var(--radius-sm); padding: 9px 12px; margin-bottom: 12px; font-size: 12px; color: var(--blue); }
.empty { text-align: center; padding: 60px 24px; color: var(--text3); }

/* ── トレンドチャート ── */
.trend-select-wrap { padding: 16px 16px 0; }
.trend-select-wrap select { font-size: 14px; }
.trend-chart-wrap { padding: 16px; }
.trend-svg-wrap { width: 100%; overflow-x: auto; }
.trend-empty { text-align: center; padding: 32px; color: var(--text3); font-size: 13px; }
.trend-stat-row { display: flex; justify-content: space-around; padding: 12px 0 4px; border-top: 0.5px solid var(--border); margin-top: 8px; }
.trend-stat { text-align: center; }
.trend-stat-label { font-size: 10px; color: var(--text3); letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 4px; }
.trend-stat-val { font-size: 16px; font-weight: 500; font-variant-numeric: tabular-nums; color: var(--accent); }

/* ── AI連携 ── */
.ai-textarea { width: 100%; min-height: 260px; background: var(--bg3); border: 0.5px solid var(--border2); border-radius: var(--radius-sm); color: var(--text); font-family: 'DM Mono', monospace; font-size: 12px; line-height: 1.6; padding: 12px; resize: vertical; outline: none; white-space: pre-wrap; }
.ai-textarea:focus { border-color: var(--accent); }
</style>
</head>
<body>
<div id="app">
  <div class="screens">

    <!-- カレンダー -->
    <div class="screen active" id="screen-home">
      <div class="cal-nav">
        <button class="btn-icon" onclick="changeMonth(-1)"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></button>
        <span class="cal-month" id="cal-title"></span>
        <button class="btn-icon" onclick="changeMonth(1)"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></button>
      </div>
      <div class="cal-grid" id="cal-day-labels">
        <div class="cal-day-label">日</div><div class="cal-day-label">月</div><div class="cal-day-label">火</div><div class="cal-day-label">水</div><div class="cal-day-label">木</div><div class="cal-day-label">金</div><div class="cal-day-label">土</div>
      </div>
      <div class="cal-grid" id="cal-body"></div>
      <div class="cal-legend" id="cal-legend"></div>
    </div>

    <!-- 記録 -->
    <div class="screen" id="screen-record">
      <div class="rec-date-bar">
        <input type="date" id="record-date" onchange="switchRecordDate()">
      </div>
      <div id="ex-cards"></div>
      <div class="add-ex-wrap">
        <button class="btn btn-ghost" style="width:100%;justify-content:center;" onclick="openAddExModal()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          種目を追加
        </button>
      </div>
    </div>

    <!-- 履歴 -->
    <div class="screen" id="screen-history">
      <div class="page-header"><h1>履歴</h1></div>
      <div style="height:12px;"></div>
      <div id="history-list"></div>
    </div>

    <!-- 統計 -->
    <div class="screen" id="screen-stats">
      <div class="page-header"><h1>統計</h1></div>
      <div id="stats-content"></div>
    </div>
  </div>

  <nav class="nav">
    <button class="nav-btn active" id="nav-home" onclick="showScreen('home')">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>カレンダー
    </button>
    <button class="nav-btn" id="nav-record" onclick="showScreen('record')">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>記録
    </button>
    <button class="nav-btn" id="nav-history" onclick="showScreen('history')">
      <svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>履歴
    </button>
    <button class="nav-btn" id="nav-stats" onclick="showScreen('stats')">
      <svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>統計
    </button>
  </nav>
</div>

<!-- 種目追加モーダル -->
<div class="modal-overlay" id="modal-add-ex">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">種目を追加</div>
    <div class="modal-body">
      <div style="margin-bottom:14px;">
        <label class="form-label">種目名</label>
        <input type="text" id="new-ex-name" placeholder="例: ベンチプレス" list="ex-suggestions" autocomplete="off">
        <datalist id="ex-suggestions"></datalist>
      </div>
      <div id="new-ex-prev"></div>
      <div style="margin-bottom:14px;">
        <label class="form-label">種目タイプ</label>
        <select id="new-ex-type">
          <option value="normal">通常（重量を追う）</option>
          <option value="assist">アシスト（軽いほど高負荷）</option>
        </select>
      </div>
      <div>
        <label class="form-label">部位タグ</label>
        <select id="new-ex-tag">
          <option value="chest">胸 (Chest)</option>
          <option value="back">背中 (Back)</option>
          <option value="legs">脚 (Legs)</option>
          <option value="shoulders">肩 (Shoulders)</option>
          <option value="arms">腕 (Arms)</option>
          <option value="core">体幹 (Core)</option>
          <option value="cardio">有酸素 (Cardio)</option>
        </select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('modal-add-ex')" style="flex:1;justify-content:center;">キャンセル</button>
      <button class="btn btn-accent" onclick="confirmAddEx()" style="flex:2;justify-content:center;">追加</button>
    </div>
  </div>
</div>

<!-- 日別詳細モーダル -->
<div class="modal-overlay" id="modal-day">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="day-title"></div>
    <div class="modal-body" id="day-content"></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('modal-day')" style="flex:1;justify-content:center;">閉じる</button>
      <button class="btn btn-accent" id="day-edit-btn" style="flex:1;justify-content:center;" onclick="goEditDay()">編集</button>
    </div>
  </div>
</div>

<!-- ChatGPT連携モーダル -->
<div class="modal-overlay" id="modal-ai">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">ChatGPT用テキスト</div>
    <div class="modal-body">
      <div style="margin-bottom:14px;">
        <label class="form-label">対象範囲</label>
        <select id="ai-range" onchange="renderAiText()">
          <option value="1">直近1回分</option>
          <option value="3">直近3回分</option>
          <option value="5">直近5回分</option>
        </select>
      </div>
      <textarea class="ai-textarea" id="ai-text" readonly></textarea>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('modal-ai')" style="flex:1;justify-content:center;">閉じる</button>
      <button class="btn btn-accent" onclick="copyAiText()" style="flex:2;justify-content:center;">コピー</button>
    </div>
  </div>
</div>

<script>
const TAGS = {chest:'胸',back:'背中',legs:'脚',shoulders:'肩',arms:'腕',core:'体幹',cardio:'有酸素'};
const TAG_COLORS = {chest:'#f5694e',back:'#4ea8f5',legs:'#4ef587',shoulders:'#c8d830',arms:'#f5b44e',core:'#b44ef5',cardio:'#f54eb4'};
let workouts = [];
let calY, calM;
let dayModalDate = null;

function loadData() {
  try { const d = localStorage.getItem('wt_workouts'); if(d) workouts = JSON.parse(d); } catch(e) { workouts=[]; }
}
function persist() {
  try { localStorage.setItem('wt_workouts', JSON.stringify(workouts)); } catch(e) {}
}
function getOrCreate(date) {
  let w = workouts.find(w => w.date === date);
  if (!w) { w = {date, exercises:[]}; workouts.push(w); workouts.sort((a,b)=>a.date.localeCompare(b.date)); }
  return w;
}
function getWorkout(date) { return workouts.find(w => w.date === date) || null; }
function calc1RM(w, r) {
  w = parseFloat(w)||0; r = parseInt(r)||0;
  if (w<=0||r<=0||r>=37) return null;
  if (r===1) return w;
  return Math.round(w*36/(37-r)*10)/10;
}
function best1RM(sets) {
  const v = sets.map(s=>calc1RM(s.weight,s.reps)).filter(Boolean);
  return v.length ? Math.max(...v) : null;
}
function minAssist(sets) {
  const v = sets.map(s=>parseFloat(s.weight)).filter(w=>!isNaN(w) && w>=0);
  return v.length ? Math.min(...v) : null;
}
function totalReps(sets) {
  return sets.reduce((s,st)=>s+(parseInt(st.reps)||0),0);
}
function getExerciseType(name) {
  for (let i = workouts.length-1; i>=0; i--) {
    const ex = workouts[i].exercises.find(e=>e.name===name);
    if (ex) return ex.type || 'normal';
  }
  return 'normal';
}
/* セッション内でのその種目の「代表値」を返す（通常=推定1RM最大、アシスト=最小アシスト重量） */
function sessionMetric(ex) {
  const isAssist = (ex.type||'normal') === 'assist';
  return isAssist
    ? {isAssist:true, value: minAssist(ex.sets), label:'最小アシスト'}
    : {isAssist:false, value: best1RM(ex.sets), label:'推定1RM'};
}
function todayStr() { return new Date().toISOString().slice(0,10); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('screen-'+name).classList.add('active');
  document.getElementById('nav-'+name).classList.add('active');
  if (name==='home') renderCalendar();
  if (name==='history') renderHistory();
  if (name==='stats') renderStats();
  if (name==='record') renderRecord();
}

/* ══ 記録 ══ */
function renderRecord() {
  const dateEl = document.getElementById('record-date');
  if (!dateEl.value) dateEl.value = todayStr();
  renderExCards(dateEl.value);
}
function switchRecordDate() { renderExCards(document.getElementById('record-date').value); }

function renderExCards(date) {
  const w = getWorkout(date);
  const exList = w ? w.exercises : [];
  const container = document.getElementById('ex-cards');
  if (!exList.length) {
    container.innerHTML = '<div class="empty" style="padding:40px 24px;"><div style="font-size:32px;margin-bottom:8px;opacity:0.3;">🏋️</div><div style="font-size:14px;">種目を追加してください</div></div>';
    return;
  }
  container.innerHTML = exList.map((ex, ei) => buildExCard(date, ei, ex)).join('');
}

function buildExCard(date, ei, ex) {
  const isAssist = (ex.type||'normal') === 'assist';
  const rm = isAssist ? null : best1RM(ex.sets);
  const minA = isAssist ? minAssist(ex.sets) : null;
  const reps = totalReps(ex.sets);
  const vol = ex.sets.reduce((s,st)=>s+(parseFloat(st.weight)||0)*(parseInt(st.reps)||0),0);
  const wLabel = isAssist ? 'assist' : 'kg';
  const metricLabel = isAssist ? '' : '1RM';
  let setsHtml = '';
  if (ex.sets.length) {
    setsHtml += `<div class="set-col-header"><div></div><div class="set-col-label">${wLabel}</div><div class="set-col-label">reps</div><div class="set-col-label" style="color:var(--blue);">${metricLabel}</div><div></div></div>`;
    setsHtml += '<div class="set-list">' + ex.sets.map((st,si) => {
      const r1 = isAssist ? null : calc1RM(st.weight, st.reps);
      return `<div class="set-item">
        <span class="set-n">${si+1}</span>
        <span class="set-val">${st.weight}</span>
        <span class="set-val">${st.reps}</span>
        <span class="set-rm-val">${r1?r1+'kg':'—'}</span>
        <button class="set-del-btn" onclick="deleteSet('${date}',${ei},${si})"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>`;
    }).join('') + '</div>';
  }
  const nextSet = ex.sets.length + 1;
  const prevSet = ex.sets.length ? ex.sets[ex.sets.length-1] : null;
  const prevW = prevSet ? prevSet.weight : '';
  const prevR = prevSet ? prevSet.reps : '';
  setsHtml += `<div class="set-input-row">
    <span class="set-n" style="color:var(--accent);">${nextSet}</span>
    <input class="set-mini-input" type="number" id="wi-${date}-${ei}" placeholder="${wLabel}" min="0" step="0.5" inputmode="decimal" value="${prevW}" onfocus="this.select()">
    <input class="set-mini-input" type="number" id="ri-${date}-${ei}" placeholder="回" min="0" step="1" inputmode="numeric" value="${prevR}" onfocus="this.select()" onkeydown="if(event.key==='Enter')confirmSet('${date}',${ei})">
    <span class="set-rm-val" id="live-rm-${date}-${ei}">${isAssist?'':'—'}</span>
    <button class="set-confirm-btn" onclick="confirmSet('${date}',${ei})"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></button>
  </div>`;
  if (isAssist) {
    setsHtml += `<div class="ex-vol">
      <span>総reps <b style="color:var(--text);font-variant-numeric:tabular-nums;">${reps}</b></span>
      ${minA!==null?`<span>最小アシスト <b style="color:var(--blue);font-variant-numeric:tabular-nums;">${minA} kg</b></span>`:''}
    </div>`;
  } else {
    setsHtml += `<div class="ex-vol">
      <span>Vol <b style="color:var(--text);font-variant-numeric:tabular-nums;">${vol.toLocaleString()} kg</b></span>
      ${rm?`<span>推定1RM <b style="color:var(--blue);font-variant-numeric:tabular-nums;">${rm} kg</b></span>`:''}
    </div>`;
  }
  return `<div class="ex-card">
    <div class="ex-card-header">
      <div class="ex-card-title">
        <span style="font-size:15px;font-weight:500;">${ex.name}</span>
        <span class="tag tag-${ex.tag}">${TAGS[ex.tag]}</span>
        ${isAssist?'<span class="tag" style="background:rgba(232,245,78,0.12);color:var(--accent);">アシスト</span>':''}
      </div>
      <button class="btn-icon" style="width:30px;height:30px;" onclick="deleteExercise('${date}',${ei})">
        <svg viewBox="0 0 24 24" style="width:14px;height:14px;"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/></svg>
      </button>
    </div>
    <div class="ex-card-body">${setsHtml}</div>
  </div>`;
}

document.addEventListener('input', e => {
  const id = e.target.id;
  const m = id.match(/^(wi|ri)-(.+)-(\d+)$/);
  if (m) {
    const [,, date, eiStr] = m;
    const ei = parseInt(eiStr);
    const workout = getWorkout(date);
    const isAssist = workout && workout.exercises[ei] && (workout.exercises[ei].type||'normal')==='assist';
    const el = document.getElementById(`live-rm-${date}-${ei}`);
    if (el) {
      if (isAssist) { el.textContent = ''; }
      else {
        const w = document.getElementById(`wi-${date}-${ei}`)?.value;
        const r = document.getElementById(`ri-${date}-${ei}`)?.value;
        const rm = calc1RM(w, r);
        el.textContent = rm ? rm+'kg' : '—';
      }
    }
  }
  if (e.target.id === 'new-ex-name') {
    const name = e.target.value.trim();
    if (!name) { document.getElementById('new-ex-prev').innerHTML=''; return; }
    const prev = [...workouts].reverse().find(w=>w.exercises.some(ex=>ex.name===name));
    if (!prev) { document.getElementById('new-ex-prev').innerHTML=''; return; }
    const ex = prev.exercises.find(e=>e.name===name);
    const isAssist = (ex.type||'normal') === 'assist';
    const dt = new Date(prev.date+'T00:00:00').toLocaleDateString('ja-JP',{month:'numeric',day:'numeric'});
    if (isAssist) {
      const minA = minAssist(ex.sets);
      document.getElementById('new-ex-prev').innerHTML =
        `<div class="prev-box" style="margin-top:10px;">前回 ${dt} — 最小アシスト ${minA!==null?minA+'kg':'—'}</div>`;
    } else {
      const rm2 = best1RM(ex.sets);
      const maxW = Math.max(...ex.sets.map(s=>parseFloat(s.weight)||0));
      document.getElementById('new-ex-prev').innerHTML =
        `<div class="prev-box" style="margin-top:10px;">前回 ${dt} — 最大 ${maxW}kg${rm2?` / 推定1RM ${rm2}kg`:''}</div>`;
    }
    document.getElementById('new-ex-type').value = ex.type || 'normal';
    document.getElementById('new-ex-tag').value = ex.tag;
  }
  if (e.target.id === 'trend-select') renderTrendChart(e.target.value);
});

function confirmSet(date, ei) {
  const w = document.getElementById(`wi-${date}-${ei}`)?.value;
  const r = document.getElementById(`ri-${date}-${ei}`)?.value;
  if (!w && !r) return;
  const workout = getOrCreate(date);
  workout.exercises[ei].sets.push({weight: w||'0', reps: r||'0'});
  persist();
  renderExCards(date);
  setTimeout(() => { document.getElementById(`wi-${date}-${ei}`)?.focus(); }, 50);
}

function deleteSet(date, ei, si) {
  const w = getWorkout(date); if (!w) return;
  w.exercises[ei].sets.splice(si, 1);
  if (!w.exercises[ei].sets.length) {
    if (!confirm('セットが0になります。種目ごと削除しますか？')) { renderExCards(date); return; }
    w.exercises.splice(ei, 1);
    if (!w.exercises.length) workouts = workouts.filter(wk => wk.date !== date);
  }
  persist(); renderExCards(date);
}

function deleteExercise(date, ei) {
  if (!confirm('この種目を削除しますか？')) return;
  const w = getWorkout(date); if (!w) return;
  w.exercises.splice(ei, 1);
  if (!w.exercises.length) workouts = workouts.filter(wk => wk.date !== date);
  persist(); renderExCards(date);
}

function openAddExModal() {
  document.getElementById('new-ex-name').value = '';
  document.getElementById('new-ex-tag').value = 'chest';
  document.getElementById('new-ex-type').value = 'normal';
  document.getElementById('new-ex-prev').innerHTML = '';
  const names = [...new Set(workouts.flatMap(w=>w.exercises.map(e=>e.name)))];
  document.getElementById('ex-suggestions').innerHTML = names.map(n=>`<option value="${n}">`).join('');
  document.getElementById('modal-add-ex').classList.add('open');
}

function confirmAddEx() {
  const name = document.getElementById('new-ex-name').value.trim();
  if (!name) { alert('種目名を入力してください'); return; }
  const tag = document.getElementById('new-ex-tag').value;
  const type = document.getElementById('new-ex-type').value;
  const date = document.getElementById('record-date').value;
  const workout = getOrCreate(date);
  if (workout.exercises.some(e=>e.name===name)) { alert('この種目はすでに追加されています'); return; }
  workout.exercises.push({name, tag, type, sets:[]});
  persist(); closeModal('modal-add-ex'); renderExCards(date);
}

/* ══ カレンダー ══ */
function renderCalendar() {
  const now = new Date();
  if (calY===undefined) { calY=now.getFullYear(); calM=now.getMonth(); }
  document.getElementById('cal-title').textContent = `${calY} / ${String(calM+1).padStart(2,'0')}`;
  const first = new Date(calY,calM,1);
  const last = new Date(calY,calM+1,0);
  const ts = now.toISOString().slice(0,10);

  const usedTags = new Set();
  workouts.forEach(w => w.exercises.forEach(ex => usedTags.add(ex.tag)));

  let html = '';
  for(let i=0;i<first.getDay();i++){
    const d=new Date(calY,calM,-first.getDay()+i+1);
    html+=`<div class="cal-cell other-month"><div class="cal-num">${d.getDate()}</div><div class="cal-dots"></div></div>`;
  }
  for(let d=1;d<=last.getDate();d++){
    const ds=`${calY}-${String(calM+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const w = getWorkout(ds);
    const isToday = ds === ts;
    const tags = w ? [...new Set(w.exercises.map(e=>e.tag))] : [];
    const dots = tags.map(t=>`<div class="cal-dot" style="background:${TAG_COLORS[t]};"></div>`).join('');
    html+=`<div class="cal-cell${isToday?' today':''}" onclick="openDayModal('${ds}')">
      <div class="cal-num">${d}</div>
      <div class="cal-dots">${dots}</div>
    </div>`;
  }
  document.getElementById('cal-body').innerHTML = html;

  const legend = [...usedTags].map(t =>
    `<div class="cal-legend-item"><div class="cal-legend-dot" style="background:${TAG_COLORS[t]};"></div>${TAGS[t]}</div>`
  ).join('');
  document.getElementById('cal-legend').innerHTML = legend;
}

function changeMonth(d){
  calM+=d;
  if(calM>11){calM=0;calY++;}
  if(calM<0){calM=11;calY--;}
  renderCalendar();
}

function openDayModal(dateStr) {
  dayModalDate = dateStr;
  const w = getWorkout(dateStr);
  const dt = new Date(dateStr+'T00:00:00').toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'short'});
  document.getElementById('day-title').textContent = dt;
  document.getElementById('day-edit-btn').style.display = w ? '' : 'none';
  if (!w) {
    document.getElementById('day-content').innerHTML = '<p style="color:var(--text3);font-size:14px;padding-bottom:8px;">この日の記録はありません</p>';
  } else {
    document.getElementById('day-content').innerHTML = w.exercises.map((ex,i) => {
      const isAssist = (ex.type||'normal') === 'assist';
      const vol = ex.sets.reduce((s,st)=>s+(parseFloat(st.weight)||0)*(parseInt(st.reps)||0),0);
      const rm = isAssist ? null : best1RM(ex.sets);
      const minA = isAssist ? minAssist(ex.sets) : null;
      return `<div style="padding:12px 0;border-bottom:0.5px solid var(--border);">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
          <span style="font-size:12px;color:var(--text3);">${String(i+1).padStart(2,'0')}</span>
          <span style="font-size:15px;font-weight:500;">${ex.name}</span>
          <span class="tag tag-${ex.tag}">${TAGS[ex.tag]}</span>
          ${isAssist?'<span class="tag" style="background:rgba(232,245,78,0.12);color:var(--accent);">アシスト</span>':''}
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:5px;">
          ${ex.sets.map((st,si)=>{
            const r1 = isAssist ? null : calc1RM(st.weight,st.reps);
            return `<span style="font-size:12px;background:var(--bg3);padding:4px 8px;border-radius:99px;color:var(--text2);">${si+1}. ${st.weight}kg×${st.reps}${r1?`<span style="color:var(--blue);"> →${r1}</span>`:''}`;
          }).join('')}
        </div>
        <div style="display:flex;gap:12px;margin-top:8px;font-size:12px;color:var(--text3);">
          ${isAssist
            ? `<span>総reps <b style="color:var(--text2);">${totalReps(ex.sets)}</b></span>${minA!==null?`<span>最小アシスト <b style="color:var(--blue);">${minA} kg</b></span>`:''}`
            : `<span>Vol <b style="color:var(--text2);">${vol.toLocaleString()} kg</b></span>${rm?`<span>推定1RM <b style="color:var(--blue);">${rm} kg</b></span>`:''}`}
        </div>
      </div>`;

function goEditDay() {
  if (!dayModalDate) return;
  closeModal('modal-day');
  document.getElementById('record-date').value = dayModalDate;
  showScreen('record');
}

/* ══ 履歴 ══ */
function renderHistory() {
  const el = document.getElementById('history-list');
  if (!workouts.length) { el.innerHTML='<div class="empty"><div style="font-size:32px;margin-bottom:8px;opacity:0.3;">📋</div><div style="font-size:14px;">記録がありません</div></div>'; return; }
  el.innerHTML = workouts.slice().reverse().map(w=>{
    const dt = new Date(w.date+'T00:00:00').toLocaleDateString('ja-JP',{month:'long',day:'numeric',weekday:'short'});

    </div>`;
  }).join('');
}

/* ══ 統計 ══ */
function renderStats() {
  const el = document.getElementById('stats-content');
  if (!workouts.length) { el.innerHTML='<div class="empty"><div style="font-size:32px;margin-bottom:8px;opacity:0.3;">📊</div><div style="font-size:14px;">記録がありません</div></div>'; return; }

  const prMap = {};
  workouts.forEach(w=>{
    w.exercises.forEach(ex=>{
      if (!ex.sets.length) return;
      const isAssist = (ex.type||'normal') === 'assist';
      if (!prMap[ex.name]) prMap[ex.name] = isAssist
        ? {isAssist:true, minA:null, date:w.date, tag:ex.tag}
        : {isAssist:false, rm:null, maxW:0, date:w.date, tag:ex.tag};
      if (isAssist) {
        const minA = minAssist(ex.sets);
        if (minA!==null && (prMap[ex.name].minA===null || minA<prMap[ex.name].minA)) { prMap[ex.name].minA=minA; prMap[ex.name].date=w.date; }
      } else {
        const rm = best1RM(ex.sets);
        const maxW = Math.max(...ex.sets.map(s=>parseFloat(s.weight)||0));
        if (rm!==null&&(prMap[ex.name].rm===null||rm>prMap[ex.name].rm)) { prMap[ex.name].rm=rm; prMap[ex.name].date=w.date; }
        if (maxW>prMap[ex.name].maxW) prMap[ex.name].maxW=maxW;
      }
    });
  });

  const totalVol = workouts.reduce((s,w)=>s+w.exercises.reduce((ss,ex)=>ss+ex.sets.reduce((sss,st)=>sss+(parseFloat(st.weight)||0)*(parseInt(st.reps)||0),0),0),0);
  const tagVol = {};
  workouts.forEach(w=>w.exercises.forEach(ex=>{ tagVol[ex.tag]=(tagVol[ex.tag]||0)+ex.sets.reduce((s,st)=>s+(parseFloat(st.weight)||0)*(parseInt(st.reps)||0),0); }));
  const maxV = Math.max(...Object.values(tagVol),1);

  const exNames = Object.keys(prMap);

  let html = `<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:16px 16px 4px;">
    <div style="background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--radius);padding:16px;text-align:center;">
      <div style="font-size:10px;color:var(--text3);letter-spacing:0.06em;text-transform:uppercase;margin-bottom:8px;">ワークアウト</div>
      <div style="font-size:28px;font-weight:500;">${workouts.length}</div>
    </div>
    <div style="background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--radius);padding:16px;text-align:center;">
      <div style="font-size:10px;color:var(--text3);letter-spacing:0.06em;text-transform:uppercase;margin-bottom:8px;">累計 Vol</div>
      <div style="font-size:24px;font-weight:500;">${(totalVol/1000).toFixed(1)}<span style="font-size:14px;"> t</span></div>
    </div>
  </div>`;

  html += `<div style="padding:20px 16px 8px;font-size:10px;color:var(--text3);letter-spacing:0.08em;text-transform:uppercase;">推移トレンド</div>`;
  html += `<div class="card">
    <div style="margin-bottom:12px;">
      <select id="trend-select" style="font-size:14px;padding:8px 12px;">
        ${exNames.map(n=>`<option value="${n}">${n}</option>`).join('')}
      </select>
    </div>
    <div id="trend-chart"></div>
  </div>`;

  if (Object.keys(prMap).length) {
    html += `<div style="padding:20px 16px 8px;font-size:10px;color:var(--text3);letter-spacing:0.08em;text-transform:uppercase;">自己記録</div><div class="card">`;
    Object.entries(prMap).sort((a,b)=>{
      const av = a[1].isAssist ? -(a[1].minA??0) : (a[1].rm||0);
      const bv = b[1].isAssist ? -(b[1].minA??0) : (b[1].rm||0);
      return bv-av;
    }).forEach(([name,pr])=>{
      const dt = new Date(pr.date+'T00:00:00').toLocaleDateString('ja-JP',{month:'numeric',day:'numeric'});
      html += `<div class="stat-metric">
        <div>
          <div style="font-size:14px;margin-bottom:4px;">${name}</div>
          <div style="display:flex;gap:6px;align-items:center;"><span class="tag tag-${pr.tag}">${TAGS[pr.tag]}</span>${pr.isAssist?'<span class="tag" style="background:rgba(232,245,78,0.12);color:var(--accent);">アシスト</span>':''}<span style="font-size:11px;color:var(--text3);">${dt}</span></div>
        </div>
        <div style="text-align:right;">
          ${pr.isAssist
            ? (pr.minA!==null?`<div class="pr-val">最小 ${pr.minA} kg</div>`:'')
            : (pr.rm!==null?`<div class="pr-val">${pr.rm} kg</div><div style="font-size:11px;color:var(--text3);">実測 ${pr.maxW} kg</div>`:'')}
        </div>
      </div>`;
    });
    html += `</div>`;
  }

  if (Object.keys(tagVol).length) {
    html += `<div style="padding:20px 16px 8px;font-size:10px;color:var(--text3);letter-spacing:0.08em;text-transform:uppercase;">部位別ボリューム</div><div class="card">`;
    Object.entries(tagVol).sort((a,b)=>b[1]-a[1]).forEach(([tag,vol])=>{
      const pct = Math.round(vol/maxV*100);
      html += `<div style="margin-bottom:12px;">
        <div style="display:flex;justify-content:space-between;margin-bottom:5px;">
          <span class="tag tag-${tag}">${TAGS[tag]}</span>
          <span style="font-size:12px;color:var(--text2);">${vol.toLocaleString()} kg</span>
        </div>
        <div style="height:4px;background:var(--bg3);border-radius:2px;"><div style="height:4px;width:${pct}%;background:var(--accent);border-radius:2px;"></div></div>
      </div>`;
    });
    html += `</div>`;
  }

  html += `<div style="padding:20px 16px 8px;font-size:10px;color:var(--text3);letter-spacing:0.08em;text-transform:uppercase;">データ管理</div>
  <div class="data-actions">
    <button class="btn btn-ghost" onclick="exportData()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      エクスポート
    </button>
    <button class="btn btn-ghost" onclick="document.getElementById('import-file').click()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      インポート
    </button>
    <input type="file" id="import-file" accept=".json" style="display:none" onchange="importData(event)">
  </div>
  <div style="padding:0 16px 8px;font-size:10px;color:var(--text3);letter-spacing:0.08em;text-transform:uppercase;">AI連携</div>
  <div class="data-actions">
    <button class="btn btn-accent" onclick="openAiModal()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 12h8M12 8v8"/><circle cx="12" cy="12" r="9"/></svg>
      ChatGPT用テキストを作成
    </button>
  </div>
  <div style="height:32px;"></div>`;

  el.innerHTML = html;

  if (exNames.length) renderTrendChart(exNames[0]);
}

/* ── トレンドチャート描画 ── */
function renderTrendChart(exName) {
  const el = document.getElementById('trend-chart');
  if (!el) return;

  const isAssist = getExerciseType(exName) === 'assist';
  const points = [];
  workouts.forEach(w => {
    const ex = w.exercises.find(e => e.name === exName);
    if (!ex || !ex.sets.length) return;
    const m = sessionMetric(ex);
    if (m.value !== null) points.push({date: w.date, rm: m.value});
  });

  if (points.length < 2) {
    el.innerHTML = `<div class="trend-empty">データが2件以上必要です<br><span style="font-size:11px;opacity:0.6;">(現在 ${points.length}件)</span></div>`;
    return;
  }

  const W = 320, H = 140, PL = 40, PR = 12, PT = 12, PB = 28;
  const cW = W - PL - PR, cH = H - PT - PB;

  const rms = points.map(p=>p.rm);
  const minRM = Math.min(...rms);
  const maxRM = Math.max(...rms);
  const rmRange = maxRM - minRM || 1;

  const xStep = cW / (points.length - 1);
  const yOf = rm => PT + cH - ((rm - minRM) / rmRange) * cH;
  const xOf = i => PL + i * xStep;

  const yTicks = [minRM, (minRM+maxRM)/2, maxRM].map(v => Math.round(v*10)/10);

  let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;overflow:visible;">`;

  yTicks.forEach(v => {
    const y = yOf(v);
    svg += `<line x1="${PL}" y1="${y}" x2="${W-PR}" y2="${y}" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>`;
    svg += `<text x="${PL-4}" y="${y+4}" text-anchor="end" font-size="9" fill="#555" font-family="-apple-system,sans-serif">${v}</text>`;
  });

  let areaPath = `M ${xOf(0)} ${yOf(points[0].rm)}`;
  points.forEach((p,i) => { if(i>0) areaPath += ` L ${xOf(i)} ${yOf(p.rm)}`; });
  areaPath += ` L ${xOf(points.length-1)} ${H-PB} L ${PL} ${H-PB} Z`;
  svg += `<path d="${areaPath}" fill="rgba(232,245,78,0.07)"/>`;

  let linePath = `M ${xOf(0)} ${yOf(points[0].rm)}`;
  points.forEach((p,i) => { if(i>0) linePath += ` L ${xOf(i)} ${yOf(p.rm)}`; });
  svg += `<path d="${linePath}" fill="none" stroke="#e8f54e" stroke-width="1.5" stroke-linejoin="round"/>`;

  const step = points.length > 8 ? Math.ceil(points.length / 8) : 1;
  points.forEach((p,i) => {
    const x = xOf(i), y = yOf(p.rm);
    svg += `<circle cx="${x}" cy="${y}" r="3" fill="#e8f54e"/>`;
    if (i % step === 0 || i === points.length-1) {
      const label = p.date.slice(5).replace('-','/');
      svg += `<text x="${x}" y="${H-PB+14}" text-anchor="middle" font-size="8.5" fill="#555" font-family="-apple-system,sans-serif">${label}</text>`;
    }
  });

  svg += `</svg>`;

  const first1RM = points[0].rm;
  const last1RM = points[points.length-1].rm;
  const best = isAssist ? Math.min(...rms) : Math.max(...rms);
  const diff = Math.round((last1RM - first1RM)*10)/10;
  const improved = isAssist ? diff <= 0 : diff >= 0;
  const diffColor = improved ? '#4ef587' : '#f5694e';
  const diffSign = diff >= 0 ? '+' : '';
  const bestLabel = isAssist ? '最小' : '最高';

  svg += `<div class="trend-stat-row">
    <div class="trend-stat"><div class="trend-stat-label">${bestLabel}</div><div class="trend-stat-val">${best} kg</div></div>
    <div class="trend-stat"><div class="trend-stat-label">最新</div><div class="trend-stat-val">${last1RM} kg</div></div>
    <div class="trend-stat"><div class="trend-stat-label">推移</div><div class="trend-stat-val" style="color:${diffColor};">${diffSign}${diff} kg</div></div>
  </div>`;

  el.innerHTML = svg;
}

/* ══ AI連携（ChatGPT用テキスト生成） ══ */
function openAiModal() {
  document.getElementById('modal-ai').classList.add('open');
  renderAiText();
}

function buildAiText() {
  if (!workouts.length) return 'まだ記録がありません。';
  const n = parseInt(document.getElementById('ai-range').value) || 1;
  const targets = workouts.slice(-n); // 直近n件（日付昇順）

  const hasAssist = targets.some(w => w.exercises.some(ex => (ex.type||'normal')==='assist'));

  let text = `以下は私の直近${targets.length}回分のトレーニング記録です。\n`;
  text += `重量(kg)×回数、各セットの推定1RM（Brzyckiの式）、前回同種目との比較を記載しています。\n`;
  if (hasAssist) {
    text += `※「アシスト」種目はマシンの補助重量です。重量が軽いほど高負荷・高難度で、値が減少していれば進歩を意味します。\n`;
  }
  text += `この内容を踏まえて、次回のトレーニングメニュー（種目・重量・回数）を提案してください。\n`;
  text += `\n` + '─'.repeat(28) + `\n`;

  targets.forEach(w => {
    const dt = new Date(w.date+'T00:00:00').toLocaleDateString('ja-JP',{month:'numeric',day:'numeric',weekday:'short'});
    text += `\n【${dt}】\n`;
    if (!w.exercises.length) { text += `（記録なし）\n`; return; }
    w.exercises.forEach(ex => {
      const isAssist = (ex.type||'normal') === 'assist';
      text += `■ ${ex.name}（${TAGS[ex.tag]}${isAssist?'・アシスト種目':''}）\n`;

      if (isAssist) {
        ex.sets.forEach((st,si) => {
          text += `  ${si+1}. アシスト${st.weight}kg × ${st.reps}回\n`;
        });
        const minA = minAssist(ex.sets);
        text += `  最小アシスト: ${minA!==null?minA+'kg':'—'}（総reps ${totalReps(ex.sets)}）\n`;

        const prevWorkout = [...workouts].filter(pw => pw.date < w.date).reverse()
          .find(pw => pw.exercises.some(pe => pe.name === ex.name));
        if (prevWorkout) {
          const prevEx = prevWorkout.exercises.find(pe => pe.name === ex.name);
          const prevMinA = minAssist(prevEx.sets);
          if (minA !== null && prevMinA !== null) {
            const diff = Math.round((minA - prevMinA) * 10) / 10;
            const sign = diff >= 0 ? '+' : '';
            const note = diff < 0 ? '（アシスト減少＝進歩）' : diff > 0 ? '（アシスト増加＝負荷ダウン）' : '（変化なし）';
            text += `  前回(${prevWorkout.date.slice(5)})比 アシスト: ${sign}${diff}kg ${note}\n`;
          }
        }
      } else {
        const rm = best1RM(ex.sets);
        const vol = ex.sets.reduce((s,st)=>s+(parseFloat(st.weight)||0)*(parseInt(st.reps)||0),0);
        ex.sets.forEach((st,si) => {
          const r1 = calc1RM(st.weight, st.reps);
          text += `  ${si+1}. ${st.weight}kg × ${st.reps}回${r1?`（推定1RM ${r1}kg）`:''}\n`;
        });
        text += `  Vol: ${vol.toLocaleString()}kg${rm?` / 推定1RM: ${rm}kg`:''}\n`;

        const prevWorkout = [...workouts].filter(pw => pw.date < w.date).reverse()
          .find(pw => pw.exercises.some(pe => pe.name === ex.name));
        if (prevWorkout) {
          const prevEx = prevWorkout.exercises.find(pe => pe.name === ex.name);
          const prevRm = best1RM(prevEx.sets);
          if (rm !== null && prevRm !== null) {
            const diff = Math.round((rm - prevRm) * 10) / 10;
            const sign = diff >= 0 ? '+' : '';
            text += `  前回(${prevWorkout.date.slice(5)})比 1RM: ${sign}${diff}kg\n`;
          }
        }
      }
      text += `\n`;
    });
  });

  text += '─'.repeat(28) + `\n`;
  text += `\n上記を踏まえて、次回のトレーニングメニューを重量・回数付きで作成してください。`;

  return text;
}

function renderAiText() {
  document.getElementById('ai-text').value = buildAiText();
}

function copyAiText() {
  const text = document.getElementById('ai-text').value;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => {
      alert('コピーしました。ChatGPTに貼り付けてください。');
    }).catch(() => {
      fallbackCopy();
    });
  } else {
    fallbackCopy();
  }
}

function fallbackCopy() {
  const ta = document.getElementById('ai-text');
  ta.removeAttribute('readonly');
  ta.select();
  try { document.execCommand('copy'); alert('コピーしました。'); }
  catch(e) { alert('コピーに失敗しました。テキストを長押しして手動でコピーしてください。'); }
  ta.setAttribute('readonly', true);
}

/* ══ エクスポート / インポート ══ */
function exportData() {
  const json = JSON.stringify(workouts, null, 2);
  const blob = new Blob([json], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download=`workout-backup-${todayStr()}.json`; a.click();
  URL.revokeObjectURL(url);
}
function importData(e) {
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const data = JSON.parse(ev.target.result);
      if (!Array.isArray(data)) throw new Error();
      if (!confirm(`${data.length}件をインポートします。現在のデータに追加しますか？`)) return;
      const existing = new Set(workouts.map(w=>w.date));
      data.forEach(w=>{ if(!existing.has(w.date)) workouts.push(w); });
      workouts.sort((a,b)=>a.date.localeCompare(b.date));
      persist(); alert('インポート完了'); renderStats();
    } catch { alert('ファイル形式が正しくありません'); }
  };
  reader.readAsText(file); e.target.value='';
}

document.querySelectorAll('.modal-overlay').forEach(m=>{
  m.addEventListener('click', e=>{ if(e.target===m) m.classList.remove('open'); });
});

loadData();
calY = new Date().getFullYear(); calM = new Date().getMonth();
renderCalendar();
document.getElementById('record-date').value = todayStr();
renderRecord();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
